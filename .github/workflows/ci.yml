name: Python and browser validation

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q agents cli.py salazar_corcoran.py enrichment.py simulator.py
      - name: Test
        run: python -m pytest -q
      - name: Example calculation
        run: python -m salazar_corcoran single --sex male --age-years 45 --weight-kg 120 --height-m 1.75 --serum-creatinine-mg-dl 1.2
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser computation tests
        run: cd web && npm test && node --check app.js
